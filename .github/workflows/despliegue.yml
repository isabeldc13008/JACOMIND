# Despliegue continuo en Azure App Service.
# La autenticación de Azure y la contraseña inicial del administrador se guardan
# como secretos del entorno «produccion»; no se versionan en el repositorio.
# Variables opcionales: AZURE_RESOURCE_GROUP, AZURE_WEBAPP_NAME, URL_PUBLICA.
# Si no existen en el entorno «produccion», se usan los valores del App Service
# de staging documentado para que el flujo no quede omitido silenciosamente.
# Secretos: AZURE_CREDENTIALS, JACOMIND_ADMIN_PASSWORD.
name: Despliegue

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  azure:
    name: Azure App Service
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: produccion
      url: ${{ vars.URL_PUBLICA || 'https://jacomind-stg-211126.azurewebsites.net' }}/app/
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-jacomind-staging' }}
      WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'jacomind-stg-211126' }}
      PUBLIC_URL: ${{ vars.URL_PUBLICA || 'https://jacomind-stg-211126.azurewebsites.net' }}
      ADMIN_PASSWORD: ${{ secrets.JACOMIND_ADMIN_PASSWORD }}
    steps:
      - name: Descargar el commit aprobado
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Configurar App Service
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --settings JACOMIND_LOGIN_LOCAL=1 JACOMIND_ADMIN_USUARIO=admin "JACOMIND_ADMIN_PASSWORD=$ADMIN_PASSWORD"
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --startup-file 'python -m api migrar && exec python -m api servir --host 0.0.0.0 --puerto $PORT'
      - name: Empaquetar la aplicación
        run: zip -qr /tmp/jacomind.zip . -x '.git/*'
      - name: Publicar en Azure
        uses: azure/cli@v2
        env:
          ZIP_PATH: /tmp/jacomind.zip
        with:
          inlineScript: |
            az webapp deploy \
              --resource-group "$RESOURCE_GROUP" \
              --name "$WEBAPP_NAME" \
              --src-path "$ZIP_PATH" \
              --type zip \
              --clean true
      - name: Comprobar desde Internet
        run: |
          for i in $(seq 1 20); do curl -fsS "$PUBLIC_URL/api/estado" && exit 0; sleep 5; done
          echo "La aplicación no responde en $PUBLIC_URL" >&2
          exit 1
      - name: Cerrar sesión en Azure
        if: always()
        run: az logout || true
