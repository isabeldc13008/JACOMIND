# Despliegue continuo: cuando el CI de main termina bien, actualiza la instancia Lightsail a ese commit.
# El acceso usa un usuario restringido («despliegue») cuya clave solo ejecuta jacomind-desplegar
# (ver despliegue/lightsail/habilitar-cd.sh). Configuración (repositorio o entorno «produccion»):
#   variable LIGHTSAIL_HOST        IP estática o dominio de la instancia (dato público)
#   variable URL_PUBLICA           URL base, p. ej. http://IP o https://dominio
#   secreto  LIGHTSAIL_SSH_KEY     clave privada ed25519 del usuario «despliegue»
#   secreto  LIGHTSAIL_KNOWN_HOSTS huella del servidor (línea de known_hosts) para no aceptar hosts desconocidos
# El trabajo «azure» (App Service de staging, ver docs/despliegue-azure.md) solo se lanza a mano.
name: Despliegue

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      destino:
        description: Dónde desplegar
        type: choice
        options: [lightsail, azure]
        default: lightsail

permissions:
  contents: read

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  lightsail:
    name: Lightsail (producción de demostración)
    # Se omite mientras el entorno no esté configurado (variable LIGHTSAIL_HOST vacía).
    if: >-
      vars.LIGHTSAIL_HOST != '' && ((github.event_name == 'workflow_dispatch' && inputs.destino != 'azure') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: produccion
      url: ${{ vars.URL_PUBLICA }}/app/
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Preparar la clave SSH
        env:
          CLAVE: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/despliegue && chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Desplegar ${{ env.COMMIT }}
        env:
          HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: ssh -i ~/.ssh/despliegue -o StrictHostKeyChecking=yes -o BatchMode=yes "despliegue@$HOST" "$COMMIT"
      - name: Comprobar desde Internet
        env:
          URL: ${{ vars.URL_PUBLICA }}
        run: |
          for i in $(seq 1 20); do curl -fsS "$URL/api/estado" && exit 0; sleep 3; done
          echo "La aplicación no responde en $URL" >&2; exit 1
      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/despliegue

  azure:
    name: Azure App Service
    # Solo manual (Actions → Despliegue → Run workflow, destino «azure»): la demo vive en Lightsail.
    if: github.event_name == 'workflow_dispatch' && inputs.destino == 'azure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: azure-staging
      url: https://jacomind-stg-211126.azurewebsites.net/app/
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'jacomind-stg-211126' }}
      AZURE_VERIFY_URL: ${{ vars.AZURE_VERIFY_URL || 'https://jacomind-stg-211126.azurewebsites.net' }}
    steps:
      - name: Descargar el commit aprobado
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - name: Publicar en Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
      - name: Comprobar desde Internet
        run: |
          for i in $(seq 1 20); do curl --retry 0 --connect-timeout 5 --max-time 15 -fsS "$AZURE_VERIFY_URL/api/estado" && exit 0; sleep 5; done
          echo "La aplicación no responde en $AZURE_VERIFY_URL" >&2
          exit 1
