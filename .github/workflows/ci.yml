# Integración continua: pruebas de todos los carriles en cada push y pull request.
# Los datos empresariales no están en el repositorio: las pruebas que los necesitan se omiten solas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicacion:
    name: Aplicación e integración (biblioteca estándar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Carril B (API, vistas, navegación y gráficos)
        run: python -m unittest discover -s tests/app -t tests/app
      - name: Integración (servidor real)
        run: python -m unittest discover -s tests/integracion -t tests/integracion

  modelos:
    name: Carril A (datos y modelos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-modelos.txt
      - name: Dependencias de entrenamiento y evaluación
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-learn==1.7.1" "numpy==1.26.4" "scipy==1.10.1" "pandas==2.3.2" "scikit-survival==0.26.0" "statsmodels==0.15.0"
      - name: Pruebas
        run: python -m unittest discover
